# ============================================================
# CI/CD Pipeline for D-Vivid SOP AI Application
# ============================================================
# Triggers on push to main branch.
#
# Pipeline:
#   1. Install dependencies
#   2. Run all tests (must pass to proceed)
#   3. Build Next.js production bundle
#   4. Deploy to production server via SSH
#   5. Health check — auto-rollback on failure
# ============================================================

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "22.22.2"
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  APP_DIR: /opt/sop-ai-app
  PM2_NAME: sop-app
  HEALTH_URL: https://sop.adelphostech.com

jobs:
  # ============================================================
  # Job 1: Test — all tests must pass
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      # Test database credentials (from GitHub Secrets)
      SOP_TEST_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}
      SOP_TEST_DB_HOST: 127.0.0.1
      SOP_TEST_DB_USER: sop_test
      SOP_TEST_DB_NAME: sop_ai_app_test
      SOP_DB_HOST: 127.0.0.1
      SOP_DB_USER: sop_test
      SOP_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}
      SOP_DB_NAME: sop_ai_app_test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: sop_ai_app_test
          MYSQL_USER: sop_test
          MYSQL_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database schema
        run: npx tsx scripts/init-test-db.ts
        env:
          SOP_TEST_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}

      - name: Create mock production database for isolation tests
        run: |
          mysql -h 127.0.0.1 -u root -p"${{ secrets.MYSQL_ROOT_PASSWORD }}" <<'SQL'
            CREATE DATABASE IF NOT EXISTS sop_ai_app;
            CREATE USER IF NOT EXISTS 'sop_app'@'%' IDENTIFIED BY '${{ secrets.SOP_TEST_DB_PASSWORD }}';
            GRANT SELECT ON sop_ai_app.* TO 'sop_app'@'%';
            FLUSH PRIVILEGES;
          SQL

      - name: Set production DB password for tests
        run: echo "SOP_PROD_DB_PASSWORD=${{ secrets.SOP_TEST_DB_PASSWORD }}" >> $GITHUB_ENV

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Phase 33 tests
        run: npx tsx tests/phase-33-document-generation-integration-tests.ts

      - name: Run Phase 33B tests
        run: npx tsx tests/phase-33b-finalizer-provenance-tests.ts

      - name: Run Phase 34 tests
        run: npx tsx tests/phase-34-consultant-review-workflow-tests.ts

      - name: Run Phase 34A tests
        run: npx tsx tests/phase-34a-test-isolation-and-export-tests.ts

      - name: Run Phase 34C tests
        run: npx tsx tests/phase-34c-finalizer-claim-metadata-retry-tests.ts

      - name: Run Phase 34D tests
        run: npx tsx tests/phase-34d-remove-component-ids-from-output-tests.ts

      - name: Run Phase 38 tests
        run: npx tsx tests/phase-38-prompt-contract-tests.ts

      - name: Run CV parse classification tests
        run: npx tsx tests/phase-cv-parse-classification-tests.ts

      - name: Test deployment and rollback safety
        run: node tests/ci-deployment-tests.cjs

      - name: Build for CV upload integration test
        run: npm run build
        env:
          NEXT_PUBLIC_BUILD_ID: ci-${{ github.sha }}-${{ github.run_number }}

      - name: Test production CV upload endpoint
        run: node tests/cv-production-upload.cjs

      - name: Archive tested build
        run: tar --exclude=.next/cache -czf next-build.tar.gz .next

      - name: Save tested build
        uses: actions/upload-artifact@v4
        with:
          name: tested-build
          path: next-build.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # Job 2: Build — production bundle
  # ============================================================
  build:
    name: Promote Tested Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-build

      - name: Verify tested artifact
        run: |
          tar -xzf next-build.tar.gz
          test -s .next/BUILD_ID
          test -f .next/prerender-manifest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # Job 3: Deploy — SSH to production, swap, health check
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Extract tested build
        run: tar -xzf next-build.tar.gz

      # ============================================================
      # SSH setup
      # ============================================================
      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Configure SSH to use the deploy key for this host
          cat > ~/.ssh/config <<EOF
          Host sop-production
            HostName $DEPLOY_HOST
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

      # ============================================================
      # Deploy: rsync code + build, then run safe deploy script
      # ============================================================
      - name: Deploy to server
        id: deploy
        run: |
          BUILD_ID="ci-${{ github.sha }}-${{ github.run_number }}"
          STAGING_DIR="${APP_DIR}.incoming-${RELEASE_ID}"
          echo "Deploying BUILD_ID=$BUILD_ID"
          ssh sop-production "test ! -e '$STAGING_DIR' && mkdir -m 700 '$STAGING_DIR'"

          # Sync source code (excluding secrets, node_modules, .next)
          rsync -az \
            --exclude node_modules \
            --exclude '.next*' \
            --exclude .git \
            --exclude '.env*' \
            --exclude next-build.tar.gz \
            --exclude uploads \
            --exclude logs \
            --exclude backups \
            --exclude baselines \
            ./ "sop-production:$STAGING_DIR/"

          # Sync the build output
          rsync -az .next/ "sop-production:$STAGING_DIR/.next/"

          # Run safe deploy script on server
          ssh sop-production \
            "APP_DIR='$APP_DIR' RELEASE_ID='$RELEASE_ID' NEXT_PUBLIC_BUILD_ID='$BUILD_ID' bash '$STAGING_DIR/scripts/ci-deploy.sh'"

          echo "deploy_done=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Health check — verify production is responding
      # ============================================================
      - name: Health check
        id: health
        run: |
          echo "Waiting for PM2 to stabilize..."
          sleep 5

          MAX_RETRIES=5
          RETRY=0
          HEALTHY=false
          EXPECTED_BUILD_ID=$(cat .next/BUILD_ID)
          [[ "$EXPECTED_BUILD_ID" =~ ^[a-zA-Z0-9_-]+$ ]]

          while [ $RETRY -lt $MAX_RETRIES ]; do
            RETRY=$((RETRY + 1))
            echo "Health check attempt $RETRY/$MAX_RETRIES..."

            STATUS=$(curl --silent --show-error --max-time 15 -o /dev/null -w "%{http_code}" "$HEALTH_URL/students" || true)
            echo "HTTP status: $STATUS"

            if [ "$STATUS" = "200" ] && curl --fail --silent --show-error --max-time 15 -o /dev/null "$HEALTH_URL/_next/static/$EXPECTED_BUILD_ID/_buildManifest.js"; then
              HEALTHY=true
              echo "healthy=true" >> $GITHUB_OUTPUT
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "::error::Health check failed after $MAX_RETRIES attempts"
            exit 1
          fi

          echo "Production is healthy!"

      # ============================================================
      # Rollback on failure — restore previous build
      # ============================================================
      - name: Rollback on failure
        if: failure() && steps.deploy.outputs.deploy_done == 'true'
        run: |
          echo "::warning::Deploy failed — attempting rollback..."
          ssh sop-production \
            "APP_DIR='$APP_DIR' RELEASE_ID='$RELEASE_ID' bash '$APP_DIR/scripts/ci-rollback.sh'"

      # ============================================================
      # Summary
      # ============================================================
      - name: Deploy summary
        if: always()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "## Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | ${{ steps.deploy.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Health | ${{ steps.health.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build ID:** ci-${{ github.sha }}-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          printf '**Commit:** %s\n' "$COMMIT_MESSAGE" >> "$GITHUB_STEP_SUMMARY"
