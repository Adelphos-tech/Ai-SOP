# ============================================================
# PR Validation Workflow
# ============================================================
# Runs on pull requests to main and release branches.
# Does NOT deploy to production.
# Does NOT access production student data.
#
# Gates:
#   1. TypeScript type check
#   2. Production build
#   3. CV provenance regression tests
#   4. CV import pipeline tests
#   5. CV parser education regression tests
#   6. CV parse classification tests
#
# NOTE: HTTP end-to-end and browser tests require a running dev
# server and are exercised locally before PR submission.
# ============================================================

name: PR Validation

on:
  pull_request:
    branches: [main, server-*]

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.2"

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    env:
      SOP_TEST_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}
      SOP_TEST_DB_HOST: 127.0.0.1
      SOP_TEST_DB_USER: sop_test
      SOP_TEST_DB_NAME: sop_ai_app_test
      SOP_DB_HOST: 127.0.0.1
      SOP_DB_USER: sop_test
      SOP_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}
      SOP_DB_NAME: sop_ai_app_test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: sop_ai_app_test
          MYSQL_USER: sop_test
          MYSQL_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database schema
        run: npx tsx scripts/init-test-db.ts
        env:
          SOP_TEST_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run CV provenance regression tests
        run: npx tsx tests/cv-provenance-verification.test.ts

      - name: Run CV skills provenance tests
        run: npx tsx tests/cv-skills-provenance.test.ts

      - name: Run CV parser education regression tests
        run: npx tsx tests/cv-parser-education-regression.test.ts

      - name: Install system dependencies for PDF processing
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies for CV parse classification tests
        run: pip install unstructured[pdf,docx] --quiet

      - name: Install spaCy English model for Unstructured
        run: python -m spacy download en_core_web_sm

      - name: Run CV parse classification tests
        run: npx tsx tests/phase-cv-parse-classification-tests.ts

      - name: Run CV import pipeline tests
        run: npx tsx tests/cv-import-pipeline.test.ts

      - name: Run DB-level cv-apply end-to-end tests
        run: npx tsx tests/cv-apply-end-to-end.test.ts

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_BUILD_ID: pr-${{ github.sha }}-${{ github.run_number }}

      - name: PR validation summary
        if: always()
        run: |
          echo "## PR Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
