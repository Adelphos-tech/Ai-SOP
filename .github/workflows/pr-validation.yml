# ============================================================
# PR Validation — pre-merge database integration tests
# ============================================================
# Runs against every pull request. Does NOT deploy.
# Uses the same isolated MySQL test database as deploy.yml.
#
# Currently covers:
#   - Country Questionnaire persistence integration test
# ============================================================

name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.2"

jobs:
  db-integration:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    env:
      SOP_TEST_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}
      SOP_TEST_DB_HOST: 127.0.0.1
      SOP_TEST_DB_USER: sop_test
      SOP_TEST_DB_NAME: sop_ai_app_test
      SOP_DB_HOST: 127.0.0.1
      SOP_DB_USER: sop_test
      SOP_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}
      SOP_DB_NAME: sop_ai_app_test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: sop_ai_app_test
          MYSQL_USER: sop_test
          MYSQL_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database schema
        run: npx tsx scripts/init-test-db.ts
        env:
          SOP_TEST_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}

      - name: Run Country Questionnaire persistence tests
        run: npx tsx tests/country-questionnaire-persistence.test.ts
        env:
          SOP_TEST_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}

      - name: Run Country Questionnaire persistence unit tests
        run: npx tsx tests/country-questionnaire-persistence-unit.test.ts

      - name: Run Country Questions completion regression tests
        run: npx tsx tests/country-questions-completion.test.ts

      - name: Run application context scope tests
        run: npx tsx tests/application-context-scope.test.ts
        env:
          SOP_TEST_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}

      - name: Run resilience acceptance tests
        run: npx tsx tests/resilience-acceptance.test.ts
        env:
          SOP_TEST_DB_PASSWORD: ${{ secrets.SOP_TEST_DB_PASSWORD }}

  static-checks:
    name: TypeScript + Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
